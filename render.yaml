services:
  - type: web
    name: agente-oc-sap
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: LLM_MODEL
        value: gemini-3.8-flash
      - key: LLM_FALLBACK_MODELS
        value: gemini-2.5-flash,gemini-2.5-flash-lite
      - key: LLM_API_KEY
        sync: false
      - key: MAX_ITERATIONS
        value: "25"
      - key: MAX_TOKENS_SESSION
        value: "200000"
      - key: LLM_TIMEOUT_MS
        value: "30000"
      - key: RATE_LIMIT_PER_MIN
        value: "20"
      - key: ACCESS_KEY
        sync: false
